services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "5432:5432"

  php:
    build: ./dockerphp

    volumes:
      - moodledata:/var/www/moodledata
      - ./moodleupload:/moodleupload
      - moodle:/var/www/html

      - ./configs/php/99-xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
      - ./configs/php/php.ini:/usr/local/etc/php/php.ini

      # config.php remains outside the public directory
      - ./moodleconfig/config.php:/var/www/html/config.php

      # Moodle 5.1+: plugins are under public/
      - ./mod/hvp:/var/www/html/public/mod/hvp

      - ./moodlehq/moodle-plugin-ci:/var/www/mpc/

    expose:
      - "9000"

  nginx:
    image: nginx
    depends_on:
      - php

    volumes:
      - ./configs/nginx/default.conf:/etc/nginx/conf.d/default.conf

      # Moodle source
      - moodle:/var/www/html

      # Moodle 5.1+: plugin under public/
      - ./mod/hvp:/var/www/html/public/mod/hvp

    ports:
      - "80:80"

volumes:
  postgres:
  moodle:
  moodledata:
  xdebugprofiles:
  mysql: